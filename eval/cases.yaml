# Evaluation set for the Fermi Podcast Companion.
#
# 17 cases over the seven supplied episodes and the five router intents.
#
# Every gold label below was read off the actual transcript
# (artifacts/transcripts.json) with `make peek`. No timestamp here is
# guessed: the suite exists to catch invented citations, so inventing gold
# data would defeat it. Where a property genuinely has no gold value the
# field is omitted, and that metric reports "—" for the case rather than a
# false pass.
#
# The corpus is the "Great Papers" series:
#   E1 Einstein's Special Relativity            52:14
#   E2 How Black Holes Radiate, Hawking 1975    45:17
#   E3 The Double Helix, Watson and Crick 1953  43:16
#   E4 Shannon and the Birth of Information     39:52
#   E5 Attention Is All You Need, 2017          36:24
#   E6 General Relativity, Einstein 1915        33:48
#   E7 On Computable Numbers, Turing 1936       33:02
#
# Note it spans physics, molecular biology, information theory, machine
# learning and mathematical logic — so "out of scope" is not the same as
# "not physics", and each refusal case below was checked against the full
# transcript to confirm the topic is genuinely absent.

cases:

  # ------------------------------------------------------------ passage_qa (5)
  - id: qa_simultaneity
    type: passage_qa
    query: "In the special relativity episode, what does Einstein mean when he says two events are simultaneous?"
    expect_intent: passage_qa
    expect_episodes: [E1]
    expect_time_ranges: [[690, 830]]
    must_mention:
      - ["simultaneous", "simultaneity"]
      - ["light", "signal"]
      - ["observer", "frame", "moving"]

  - id: qa_bekenstein_entropy
    type: passage_qa
    query: "Why did Bekenstein think a black hole should have entropy?"
    expect_intent: passage_qa
    expect_episodes: [E2]
    expect_time_ranges: [[266, 390]]
    must_mention:
      - ["entropy"]
      - ["area", "horizon"]
      - ["second law", "never decreases", "increases"]

  - id: qa_base_pairing
    type: passage_qa
    query: "What is the base pairing rule in the Watson and Crick paper, and why does it matter?"
    expect_intent: passage_qa
    expect_episodes: [E3]
    # Two ranges, either of which supports a correct answer. The first is
    # where the pairing rule itself is derived (hydrogen bonds: "A and T fit
    # together", "G and C fit together perfectly"); the second is Chargaff's
    # numerical observation that the rule explains. The second range alone
    # was the original gold label and it was wrong -- it marks the *clue*,
    # not the rule -- found when the improved run retrieved 19:11-20:43 and
    # was scored as a recall miss for finding the better passage.
    expect_time_ranges: [[1150, 1300], [539, 680]]
    must_mention:
      # Bare single letters are not usable as evidence tokens -- "A" or "T"
      # match almost any sentence. But the episode itself mostly says "A
      # pairs with T" rather than "adenine", so requiring the full chemical
      # names failed a correct answer. Accept either form, as a phrase.
      # Tokens are chosen to survive paraphrase. "A pairs with T" failed a
      # correct answer that said "A always pairs with T" -- substring
      # matching does not tolerate an inserted adverb -- so the token is the
      # invariant fragment "pairs with T" instead.
      - ["adenine", "pairs with t", "a-t", "a\u2013t"]
      - ["guanine", "pairs with c", "g-c", "g\u2013c"]
      - ["copy", "copies", "replicate", "template"]

  - id: qa_shannon_redundancy
    type: passage_qa
    query: "What does Shannon mean by redundancy, and why is it useful rather than wasteful?"
    expect_intent: passage_qa
    expect_episodes: [E4]
    expect_time_ranges: [[1080, 1230]]
    must_mention:
      - ["redundancy", "redundant"]
      - ["error", "errors", "noise", "noisy"]

  - id: qa_halting_problem
    type: passage_qa
    query: "What is the halting problem and how does Turing show no machine can solve it?"
    expect_intent: passage_qa
    expect_episodes: [E7]
    expect_time_ranges: [[1377, 1620]]
    must_mention:
      - ["halt", "halts", "halting"]
      - ["contradiction", "self-reference", "itself"]

  # -------------------------------------------------------- episode_routing (3)
  - id: route_entropy
    type: episode_routing
    query: "Which episodes should I listen to if I want to understand entropy, and why?"
    expect_intent: episode_routing
    # Entropy is developed independently in two episodes: Bekenstein-Hawking
    # black hole entropy (E2) and Shannon's information entropy (E4).
    expect_episodes: [E2, E4]
    must_mention: [["episode", "Episode"]]

  - id: route_beginner_order
    type: episode_routing
    query: "I'm new to this collection. Where should I start, and in what order?"
    expect_intent: episode_routing
    must_mention: [["episode", "Episode", "start"]]

  - id: route_curved_spacetime
    type: episode_routing
    query: "Which episode covers gravity as curved spacetime?"
    expect_intent: episode_routing
    expect_episodes: [E6]

  # --------------------------------------------------- cross_episode_compare (3)
  - id: compare_entropy_two_senses
    type: cross_episode_compare
    query: "Compare how the black hole episode and the Shannon episode each use the word entropy."
    expect_intent: cross_episode_compare
    expect_episodes: [E2, E4]
    expect_time_ranges: [[266, 390], [517, 625]]
    must_mention:
      - ["entropy"]
      - ["information", "bits", "message"]
      - ["horizon", "area", "black hole"]

  - id: compare_fundamental_limits
    type: cross_episode_compare
    query: "Several of these papers prove something is impossible. Compare the limits Shannon and Turing establish."
    expect_intent: cross_episode_compare
    expect_episodes: [E4, E7]
    must_mention:
      - ["capacity", "compress", "channel", "limit"]
      - ["comput", "halt", "machine"]

  - id: compare_two_einstein_episodes
    type: cross_episode_compare
    query: "How does the general relativity episode build on the special relativity one?"
    expect_intent: cross_episode_compare
    expect_episodes: [E1, E6]

  # -------------------------------------------------------- clarify_previous (2)
  - id: followup_simplify
    type: clarify_previous
    history:
      - "What is the equivalence principle in the general relativity episode?"
    query: "I didn't follow that. Walk me through it step by step."
    expect_intent: clarify_previous
    # Must reuse the previous turn's evidence rather than abstaining: a
    # request to re-explain carries no searchable content of its own.
    expect_episodes: [E6]
    must_not_mention:
      - "don't have any sources"
      - "do not have any sources"
      - "these episodes don't cover"

  - id: followup_pronoun
    type: clarify_previous
    history:
      - "What is the halting problem?"
    query: "Why did that matter for Hilbert's programme?"
    # Tests query rewriting: "that" must resolve to the halting problem
    # before retrieval, or the search returns noise.
    #
    # Gold intent is passage_qa, not clarify_previous, on reflection: the
    # learner is asking a NEW substantive question that happens to contain a
    # pronoun, not asking for the previous answer to be restated. In this
    # system clarify_previous means "reuse the last turn's evidence without
    # searching again", which would be the wrong strategy here -- Hilbert's
    # programme needs its own retrieval. The label was corrected after
    # inspecting what each intent actually does, not to match an output.
    expect_intent: passage_qa
    expect_episodes: [E7]
    must_mention:
      - ["Hilbert"]

  # ------------------------------------------------------------ locate_audio (1)
  - id: locate_photo51
    type: locate_audio
    history:
      - "What was Photograph 51 and what did it show?"
    query: "Take me to the part of the audio that supports that."
    expect_intent: locate_audio
    expect_episodes: [E3]
    expect_time_ranges: [[640, 730]]

  # ------------------------------------------------------------ out_of_scope (3)
  # Each topic below was grepped against the full transcript and returns zero
  # hits, so a confident answer here is a fabrication, not a retrieval miss.
  - id: oos_superconductivity
    type: out_of_scope
    query: "How do these episodes explain superconductivity and BCS theory?"
    should_abstain: true
    must_not_mention:
      - "as the speakers explain"
      - "in this episode they explain"

  - id: oos_higgs
    type: out_of_scope
    query: "What do these episodes say about the discovery of the Higgs boson at the LHC?"
    should_abstain: true
    must_not_mention:
      - "as discussed in the episode"

  - id: oos_plate_tectonics
    type: out_of_scope
    query: "Do any of these episodes cover plate tectonics and continental drift?"
    expect_intent: episode_routing
    should_abstain: true
